<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="生长备忘录" />
    <title>生长备忘录</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="todayLine">今天</p>
          <h1>生长备忘录</h1>
        </div>
        <button class="icon-button" id="themeToggle" type="button" aria-label="切换深色模式" title="切换深色模式">
          <span aria-hidden="true">◐</span>
        </button>
      </header>

      <main>
        <section class="view active" id="view-write" aria-labelledby="tab-write">
          <form class="composer" id="memoForm">
            <div class="composer-head">
              <label for="memoInput">现在想到什么？</label>
              <span id="draftState">已准备</span>
            </div>
            <textarea id="memoInput" rows="8" placeholder="写一句也可以。比如：#复盘 今天注意力最好的时间是上午十点。"></textarea>

            <div class="image-picker">
              <label class="image-button">
                添加图片
                <input id="imageInput" type="file" accept="image/*" multiple />
              </label>
              <span id="imageHint">最多 3 张，会自动压缩</span>
            </div>
            <div class="image-preview" id="imagePreview"></div>

            <div class="tool-row" aria-label="常用标签">
              <button type="button" class="chip" data-insert="#复盘">#复盘</button>
              <button type="button" class="chip" data-insert="#学习">#学习</button>
              <button type="button" class="chip" data-insert="#健康">#健康</button>
              <button type="button" class="chip" data-insert="#情绪">#情绪</button>
              <button type="button" class="chip" data-insert="#灵感">#灵感</button>
            </div>

            <div class="field-grid">
              <label class="field">
                <span>状态</span>
                <select id="moodSelect">
                  <option value="平静">平静</option>
                  <option value="清醒">清醒</option>
                  <option value="开心">开心</option>
                  <option value="疲惫">疲惫</option>
                  <option value="焦虑">焦虑</option>
                  <option value="低落">低落</option>
                </select>
              </label>
              <label class="field">
                <span>关联目标</span>
                <select id="goalSelect"></select>
              </label>
            </div>

            <div class="template-row" aria-label="快速模板">
              <button type="button" data-template="今天我做对的一件小事是：">做对了</button>
              <button type="button" data-template="我反复卡住的问题是：">卡住了</button>
              <button type="button" data-template="下一步最小行动是：">下一步</button>
              <button type="button" data-template="值得以后提醒自己的话：">提醒我</button>
            </div>

            <button class="primary-button" type="submit">保存这一条</button>
          </form>

          <section class="section-block">
            <div class="section-title">
              <h2>今天</h2>
              <span id="todayCount">0 条</span>
            </div>
            <div class="mini-list" id="todayList"></div>
          </section>
        </section>

        <section class="view" id="view-review" aria-labelledby="tab-review">
          <div class="search-panel">
            <input id="searchInput" type="search" placeholder="搜索内容、标签或目标" />
            <div class="tag-strip" id="tagStrip"></div>
          </div>
          <div class="timeline" id="timeline"></div>
        </section>

        <section class="view" id="view-wander" aria-labelledby="tab-wander">
          <div class="wander-panel">
            <p class="eyebrow">随机漫步</p>
            <article class="random-card" id="randomCard"></article>
            <button class="primary-button" id="randomButton" type="button">再遇见一条</button>
          </div>

          <section class="section-block">
            <div class="section-title">
              <h2>精华</h2>
              <span id="starCount">0 条</span>
            </div>
            <div class="mini-list" id="starList"></div>
          </section>
        </section>

        <section class="view" id="view-data" aria-labelledby="tab-data">
          <div class="stats-grid">
            <div class="stat-card">
              <span>总记录</span>
              <strong id="totalStat">0</strong>
            </div>
            <div class="stat-card">
              <span>连续天数</span>
              <strong id="streakStat">0</strong>
            </div>
            <div class="stat-card">
              <span>本周</span>
              <strong id="weekStat">0</strong>
            </div>
          </div>

          <section class="section-block">
            <div class="section-title">
              <h2>热力图</h2>
              <span>最近 84 天</span>
            </div>
            <div class="heatmap" id="heatmap" aria-label="最近 84 天记录热力图"></div>
          </section>

          <section class="section-block">
            <div class="section-title">
              <h2>每周复盘</h2>
              <span id="weekRange"></span>
            </div>
            <div class="review-card" id="weeklyReview"></div>
          </section>

          <section class="section-block">
            <div class="section-title">
              <h2>目标</h2>
              <span id="goalCount">0 个</span>
            </div>
            <form class="goal-form" id="goalForm">
              <input id="goalInput" type="text" maxlength="18" placeholder="添加目标" />
              <button type="submit">添加</button>
            </form>
            <div class="goal-list" id="goalList"></div>
          </section>

          <section class="section-block">
            <div class="section-title">
              <h2>备份</h2>
              <span>本地数据</span>
            </div>
            <div class="backup-row">
              <button id="exportButton" type="button">导出 JSON</button>
              <label class="import-button">
                导入 JSON
                <input id="importInput" type="file" accept="application/json" />
              </label>
            </div>
          </section>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="active" id="tab-write" data-view="write" type="button">
          <span aria-hidden="true">＋</span>
          记录
        </button>
        <button id="tab-review" data-view="review" type="button">
          <span aria-hidden="true">⌕</span>
          回顾
        </button>
        <button id="tab-wander" data-view="wander" type="button">
          <span aria-hidden="true">↻</span>
          漫步
        </button>
        <button id="tab-data" data-view="data" type="button">
          <span aria-hidden="true">▦</span>
          数据
        </button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="editModal" hidden>
      <form class="edit-dialog" id="editForm">
        <div class="section-title">
          <h2>编辑记录</h2>
          <button class="plain-button" id="editCancel" type="button">取消</button>
        </div>
        <textarea id="editInput" rows="10"></textarea>
        <button class="primary-button" type="submit">保存修改</button>
      </form>
    </div>
    <div class="image-viewer" id="imageViewer" hidden>
      <button class="viewer-close" id="imageViewerClose" type="button" aria-label="关闭图片">×</button>
      <img id="imageViewerImg" alt="放大查看图片" />
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
